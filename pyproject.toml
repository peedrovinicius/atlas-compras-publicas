[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "atlas-compras-publicas"
version = "1.67.0"
description = "Inteligência de dados auditável para compras públicas no Brasil."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["compras-publicas", "pncp", "dados-publicos", "engenharia-de-dados", "analise-de-dados", "brasil"]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "polars>=1.18,<2",
  "duckdb>=1.1,<2",
]

[project.urls]
Repository = "https://github.com/peedrovinicius/atlas-compras-publicas"
Documentation = "https://github.com/peedrovinicius/atlas-compras-publicas/tree/main/docs"
Demo = "https://atlas-compras-publicas-web.onrender.com"
API = "https://atlas-compras-publicas-analytics.onrender.com/docs"
Issues = "https://github.com/peedrovinicius/atlas-compras-publicas/issues"

[project.optional-dependencies]
api = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]
dev = [
  "pytest>=8.3,<10",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "fastapi>=0.116,<1",
]

[project.scripts]
atlas = "dental_procurement_intelligence.cli:main"
dpi = "dental_procurement_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dental_procurement_intelligence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]