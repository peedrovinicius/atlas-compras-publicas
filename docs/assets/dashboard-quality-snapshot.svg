<text x="272" y="160" class="cardn">984</text>

<rect x="480" y="104" width="210" height="74" rx="10" class="panel"/>
<text x="496" y="128" class="cardl">Medicamentos</text>
<text x="496" y="160" class="cardn">192 / 768</text>

<rect x="704" y="104" width="244" height="74" rx="10" class="panel"/>
<text x="720" y="128" class="cardl">Baseline medicamentos</text>
<text x="720" y="160" class="cardn">88,93%</text>

<text x="32" y="205" class="sub">Micro accuracy independente por holdout técnico</text>
