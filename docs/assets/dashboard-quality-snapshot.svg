<svg xmlns="http://www.w3.org/2000/svg" width="980" height="790" viewBox="0 0 980 790" role="img" aria-labelledby="title desc">
<title id="title">Atlas de Compras Públicas, snapshot real de qualidade</title>
<desc id="desc">Micro accuracy das baselines técnicas v1 a v12 e baselines independentes de medicamentos v1 a v4.</desc>
<style>
  .bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:1}
  .title{fill:#f0f6fc;font:700 30px system-ui,sans-serif}
  .sub{fill:#8b949e;font:14px system-ui,sans-serif}
  .cardn{fill:#f0f6fc;font:700 28px system-ui,sans-serif}
  .cardl{fill:#8b949e;font:12px system-ui,sans-serif;text-transform:uppercase}
  .axis{fill:#c9d1d9;font:12px system-ui,sans-serif}
  .track{fill:#21262d}.bar{fill:#58a6ff}.value{fill:#c9d1d9;font:12px system-ui,sans-serif}
  .med{fill:#3fb950}.note{fill:#8b949e;font:12px system-ui,sans-serif}
</style>
<rect width="980" height="790" class="bg"/>
<text x="32" y="50" class="title">Atlas de Compras Públicas</text>
<text x="32" y="76" class="sub">Snapshot real de qualidade, gerado das baselines congeladas do repositório</text>

<rect x="32" y="104" width="210" height="74" rx="10" class="panel"/>
<text x="48" y="128" class="cardl">Exemplos técnicos</text>
<text x="48" y="160" class="cardn">548</text>

