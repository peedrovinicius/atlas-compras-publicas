name: CI

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "render.yaml"
      - ".github/pull_request_template.md"
      - "src/**"
      - "web/**"
      - "tests/**"
      - "data/evaluation/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "docs/dashboard-quality-snapshot.json"
      - "docs/dashboard-quality-snapshot.html"
      - "docs/assets/dashboard-quality-snapshot.svg"
  push:
    branches:
      - main
      - develop
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "render.yaml"
      - ".github/pull_request_template.md"
      - "src/**"
      - "web/**"
      - "tests/**"
      - "data/evaluation/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "docs/dashboard-quality-snapshot.json"
      - "docs/dashboard-quality-snapshot.html"
      - "docs/assets/dashboard-quality-snapshot.svg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: web
        env:
          VITE_API_BASE_URL: https://atlas-compras-publicas.onrender.com
        run: npm run build
