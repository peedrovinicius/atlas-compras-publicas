name: CI

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "render.yaml"
      - ".github/pull_request_template.md"
      - "src/**"
      - "web/**"
      - "tests/**"
      - "data/evaluation/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "docs/dashboard-quality-snapshot.json"
      - "docs/dashboard-quality-snapshot.html"
      - "docs/assets/dashboard-quality-snapshot.svg"
  push:
    branches:
      - main
      - develop
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "render.yaml"
      - ".github/pull_request_template.md"
      - "src/**"
      - "web/**"
      - "tests/**"
      - "data/evaluation/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "docs/dashboard-quality-snapshot.json"
      - "docs/dashboard-quality-snapshot.html"
      - "docs/assets/dashboard-quality-snapshot.svg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Enforce develop to main release flow
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          test "$HEAD_REF" = "develop" || {
            echo "Pull Requests para main devem partir de develop."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install web
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web
        working-directory: web
        env:
          VITE_API_BASE_URL: https://atlas-compras-publicas-analytics.onrender.com
        run: npm run build

      - name: Install browser test dependency
        working-directory: web
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser and mobile smoke tests
        working-directory: web
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/atlas-vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          node --test tests/browser-smoke.test.mjs
