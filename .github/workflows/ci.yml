name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/evaluation/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "docs/dashboard-quality-snapshot.json"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "data/evaluation/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "docs/dashboard-quality-snapshot.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q
